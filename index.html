<!DOCTYPE html>
<html>
<head>
    <title>File Upload Utility</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 15px;
        }

        .drop-zone {
            border: 2px dashed #4facfe;
            padding: 20px;
            border-radius: 10px;
            background: #f9fbff;
            margin-bottom: 15px;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        ul {
            text-align: left;
            padding-left: 20px;
        }

        progress {
            width: 100%;
            height: 20px;
        }

        button {
            margin-top: 15px;
            background: #4facfe;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #007bff;
        }
    </style>

</head>
<body>

<div class="container">
    <h2>File Upload Utility</h2>

    <!-- Drag & Drop Zone -->
    <div class="drop-zone">
        <p>Drag & Drop Files Here</p>
        <p>OR</p>
        <input type="file" multiple>
    </div>

    <!-- File List -->
    <h4>Uploaded Files:</h4>
    <ul>
        <li>file1.pdf</li>
        <li>image1.jpg</li>
        <li>document.docx</li>
    </ul>

    <!-- Progress -->
    <h4>Conversion Progress:</h4>
    <progress value="60" max="100"></progress>
    <p>60% Completed</p>

    <!-- Button -->
    <button>Start Conversion</button>
</div>

</body>
</html>
